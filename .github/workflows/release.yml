name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: The version in package.json, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: week
        shell: bash
        run: echo "value=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}-${{ steps.week.outputs.value }}
      - run: npm ci
      - run: npm run check
      - name: Integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Restricted workspace tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:restricted
      - name: Restricted workspace tests
        if: runner.os != 'Linux'
        run: npm run test:restricted

  package:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      pre-release: ${{ steps.version.outputs.pre-release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: week
        shell: bash
        run: echo "value=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}-${{ steps.week.outputs.value }}
      - run: npm ci
      - name: Check the version
        id: version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_INPUT: ${{ inputs.version }}
        run: node scripts/release.mjs version
      - name: Package
        env:
          PRE_RELEASE: ${{ steps.version.outputs.pre-release }}
        run: npm run package -- ${PRE_RELEASE:+"$PRE_RELEASE"}
      - name: Install the package in a clean profile
        run: npm run compile:host-tests && node scripts/verify-vsix.mjs
      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release.mjs notes "${VERSION}" release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release
          path: |
            streamscope-*.vsix
            release-notes.md
          if-no-files-found: error

  publish-marketplace:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release
      - name: Publish to the Visual Studio Marketplace
        env:
          VERSION: ${{ needs.package.outputs.version }}
          PRE_RELEASE: ${{ needs.package.outputs.pre-release }}
        run: npm exec --no -- vsce publish --oidc --packagePath "streamscope-${VERSION}.vsix" ${PRE_RELEASE:+"$PRE_RELEASE"}

  publish-open-vsx:
    needs: package
    if: vars.OPEN_VSX_TRUSTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release
      - name: Publish to Open VSX
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: npm exec --no -- ovsx publish --trusted-publishing --packagePath "streamscope-${VERSION}.vsix"

  github-release:
    needs: [package, publish-marketplace, publish-open-vsx]
    if: always() && needs.publish-marketplace.result == 'success' && (needs.publish-open-vsx.result == 'success' || needs.publish-open-vsx.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          PRE_RELEASE: ${{ needs.package.outputs.pre-release == '--pre-release' && '--prerelease' || '' }}
        run: >-
          gh release create "v${VERSION}" "streamscope-${VERSION}.vsix"
          --title "Streamscope ${VERSION}" --notes-file release-notes.md
          --target "${GITHUB_SHA}" ${PRE_RELEASE:+"$PRE_RELEASE"}
